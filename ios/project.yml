name: Kuzey
options:
  bundleIdPrefix: com.bilalsenturk
  deploymentTarget:
    iOS: "17.0"
targets:
  Kuzey:
    type: application
    platform: iOS
    sources:
      - path: Karavan
      - path: Shared
    dependencies:
      - target: KuzeyWidgets
    entitlements:
      path: Karavan/Kuzey.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bilalsenturk.kuzey
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bilalsenturk.kuzey
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Kuzey
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSLocationWhenInUseUsageDescription: "Canlı yolculuk takibi: Riga'ya kalan mesafe, hız ve sıradaki durak konumunuza göre hesaplanır."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Arka planda da takip: duraklara varışta otomatik bildirim ve canlı konum yayını için."
        NSCameraUsageDescription: "Fiş/pompa tutarı okuma, belge tarama ve tabela çevirisi için kamera kullanılır."
        NSMicrophoneUsageDescription: "Eller serbest sesli harcama eklemek için mikrofon kullanılır."
        NSSpeechRecognitionUsageDescription: "Söylediğin harcamayı yazıya çevirmek için konuşma tanıma kullanılır."
        NSPhotoLibraryUsageDescription: "Yol fotoğraflarını rota haritasına iğnelemek (foto günlüğü) için fotoğraflara erişilir."
        NSFaceIDUsageDescription: "Belge kasasını (pasaport, sigorta) yalnızca sana açmak için Face ID kullanılır."
        NSMotionUsageDescription: "Barometreyle irtifa ve hava basıncı okunur: dağ geçitlerinde yükseklik ve ani basınç düşüşünde fırtına uyarısı için."
        NSSupportsLiveActivities: true
        # Yalnızca standart HTTPS kullanılıyor → ihracat kısıtlamasından muaf.
        # (TestFlight'ta her yüklemede sorulan uyumluluk sorusunu atlar.)
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # Simülatörde yerel Astro dev sunucusuna (http://localhost:4321) izin ver.
        # Uzak trafiğe dokunmaz; yalnızca localhost/*.local/adsız hostlar.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Arka planda hava kontrolü + canlı konum + varış geofence
        UIBackgroundModes:
          - fetch
          - location
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - com.bilalsenturk.kuzey.weather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalsenturk.kuzey
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YQUGG5VXCC
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Ana ekran / kilit ekranı widget'ları + Sürüş Live Activity (Dynamic Island)
  KuzeyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/KuzeyWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bilalsenturk.kuzey
    info:
      path: Widgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Kuzey
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalsenturk.kuzey.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YQUGG5VXCC
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
