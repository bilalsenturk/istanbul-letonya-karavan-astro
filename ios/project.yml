name: Kuzey
options:
  bundleIdPrefix: com.bilalsenturk
  deploymentTarget:
    iOS: "17.0"
targets:
  Kuzey:
    type: application
    platform: iOS
    sources:
      - path: Karavan
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Kuzey
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSLocationWhenInUseUsageDescription: "Canlı yolculuk takibi: Riga'ya kalan mesafe, hız ve sıradaki durak konumunuza göre hesaplanır."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Arka planda da takip: duraklara varışta otomatik bildirim ve canlı konum yayını için."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # Simülatörde yerel Astro dev sunucusuna (http://localhost:4321) izin ver.
        # Uzak trafiğe dokunmaz; yalnızca localhost/*.local/adsız hostlar.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Arka planda hava kontrolü + canlı konum + varış geofence
        UIBackgroundModes:
          - fetch
          - location
        BGTaskSchedulerPermittedIdentifiers:
          - com.bilalsenturk.kuzey.weather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bilalsenturk.kuzey
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
