<svg xmlns="http://www.w3.org/2000/svg" width="108" height="64" viewBox="0 0 108 64" fill="none">
  <title>Volkswagen Passat Variant B8 towing an Adria Altea 432 PX</title>
  <desc>Compact map icon, left-facing, transparent background.</desc>

  <defs>
    <linearGradient id="carPaint" x1="0" y1="25" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#EEF2F5"/>
      <stop offset="1" stop-color="#CBD3DA"/>
    </linearGradient>
    <linearGradient id="vanPaint" x1="0" y1="10" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EDF1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="17" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#43586B"/>
      <stop offset="1" stop-color="#17293A"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-150%" width="140%" height="400%">
      <feGaussianBlur stdDeviation="1.15"/>
    </filter>
  </defs>

  <!-- subtle map shadow -->
  <ellipse cx="54" cy="53.2" rx="48" ry="2.7" fill="#142132" opacity=".18" filter="url(#blur)"/>

  <!-- ================= PASSAT VARIANT B8 ================= -->
  <g id="passat">
    <!-- towbar behind car -->
    <path d="M49.8 42.1H55.7" stroke="#263747" stroke-width="1.9" stroke-linecap="round"/>
    <circle cx="55.8" cy="42.1" r="1.25" fill="#263747"/>

    <!-- body, characteristic B8 long wagon profile -->
    <path d="M4.4 42.5
             L5.5 36.8
             C5.9 34.6 7.6 32.9 9.8 32.3
             L18.2 30.2
             L26.8 23.1
             C28.5 21.7 30.7 20.9 33 20.9
             H41.8
             C44.2 20.9 46.4 21.8 48 23.5
             L54.2 30.1
             L57.8 31
             C60.4 31.7 62.3 34 62.5 36.7
             L62.7 40.1
             C62.8 41.5 61.7 42.7 60.3 42.7
             H4.4Z"
          fill="url(#carPaint)" stroke="#4E5D6B" stroke-width="1.05" stroke-linejoin="round"/>

    <!-- hood and Passat shoulder line -->
    <path d="M5.6 35.8L18.9 32.1L27.6 24.5"
          stroke="#9AA8B5" stroke-width=".65" stroke-linecap="round"/>
    <path d="M8.3 35.6H58.6" stroke="#AAB5BF" stroke-width=".75" stroke-linecap="round"/>
    <path d="M18.4 31.1H55.8" stroke="#D9E0E5" stroke-width=".55" stroke-linecap="round"/>

    <!-- Passat windows -->
    <path d="M21.2 29.8L28.4 23.9C29.6 22.9 31 22.4 32.6 22.4H35.1V29.8H21.2Z"
          fill="url(#glass)" stroke="#243646" stroke-width=".45"/>
    <path d="M36.2 22.4H41.6C43.4 22.4 45 23 46.2 24.3L51.4 29.8H36.2V22.4Z"
          fill="url(#glass)" stroke="#243646" stroke-width=".45"/>
    <path d="M47.3 24.3L53 30L55.8 30.7L52.4 25.4C51.6 24.3 50.4 23.7 49.1 23.7H47.8Z"
          fill="url(#glass)" stroke="#243646" stroke-width=".45"/>

    <!-- pillars / chrome window surround -->
    <path d="M35.6 22.2V30.1M46.9 24.1L46.1 30.1"
          stroke="#111E2A" stroke-width=".75"/>
    <path d="M20.6 30.3L27.9 23.5C29.2 22.3 30.9 21.7 32.7 21.7H41.8C44 21.7 46 22.5 47.5 24L53.4 30.3"
          stroke="#C8D0D7" stroke-width=".58" stroke-linecap="round"/>

    <!-- doors and handles -->
    <path d="M27.8 30.2V42.2M39.8 30.2V42.2M52.4 30.5V42.2"
          stroke="#9DA9B4" stroke-width=".55"/>
    <path d="M30.5 33.5H33.4M42.5 33.5H45.4"
          stroke="#536371" stroke-width=".7" stroke-linecap="round"/>

    <!-- front fascia: grille, headlamp, lower intake -->
    <path d="M5.6 35.1L15.7 33.6L20 34.1L17.6 36H6"
          fill="#253746" stroke="#536473" stroke-width=".45" stroke-linejoin="round"/>
    <path d="M7.4 34.8L16.7 34.2" stroke="#E6F4FF" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M6.1 38.4H16.6" stroke="#354654" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M5.1 40.5H11.9" stroke="#7E8B96" stroke-width=".55" stroke-linecap="round"/>

    <!-- mirror -->
    <path d="M24.9 29.3L22.3 29.9C21.7 30 21.4 30.7 21.8 31.2L22.4 31.8H25.1Z"
          fill="#E9EEF2" stroke="#536371" stroke-width=".55"/>

    <!-- rear lamp and bumper -->
    <path d="M56 31L61.1 32.7L61.6 36.1L57.6 35.2Z" fill="#C94146"/>
    <path d="M59.5 40.5H62.3" stroke="#6C7782" stroke-width=".7" stroke-linecap="round"/>

    <!-- rocker chrome -->
    <path d="M14.1 41.5H55.5" stroke="#87949F" stroke-width=".75" stroke-linecap="round"/>

    <!-- wheels -->
    <g>
      <circle cx="18.2" cy="43.1" r="5.8" fill="#202B35"/>
      <circle cx="18.2" cy="43.1" r="3.55" fill="#D7DEE4" stroke="#707D88" stroke-width=".55"/>
      <path d="M18.2 40.1V46.1M15.2 43.1H21.2M16.1 41L20.3 45.2M20.3 41L16.1 45.2"
            stroke="#6D7984" stroke-width=".55"/>
      <circle cx="18.2" cy="43.1" r=".8" fill="#76838D"/>
    </g>
    <g>
      <circle cx="52.6" cy="43.1" r="5.8" fill="#202B35"/>
      <circle cx="52.6" cy="43.1" r="3.55" fill="#D7DEE4" stroke="#707D88" stroke-width=".55"/>
      <path d="M52.6 40.1V46.1M49.6 43.1H55.6M50.5 41L54.7 45.2M54.7 41L50.5 45.2"
            stroke="#6D7984" stroke-width=".55"/>
      <circle cx="52.6" cy="43.1" r=".8" fill="#76838D"/>
    </g>
  </g>

  <!-- ================= ADRIA ALTEA 432 PX ================= -->
  <g id="adria">
    <!-- A-frame drawbar -->
    <path d="M55.8 42.1L65.2 39.2M55.8 42.1L65.2 43"
          stroke="#485867" stroke-width="1.25" stroke-linecap="round"/>
    <path d="M62.7 41.1H66.4" stroke="#2D3D4B" stroke-width="1.25" stroke-linecap="round"/>

    <!-- body: tall rounded rear, sloped aerodynamic front -->
    <path d="M65.2 43.7
             V21.5
             C65.2 17.9 67.4 14.9 70.7 13.5
             C76.7 10.9 93.5 10.6 99.3 13.6
             C102.4 15.2 104.1 18.3 104.2 21.8
             L104.8 43.7
             H65.2Z"
          fill="url(#vanPaint)" stroke="#4E5D6B" stroke-width="1.1" stroke-linejoin="round"/>

    <!-- Altea roof and front nose contour -->
    <path d="M65.7 22.3C66.7 17.6 69.3 14.6 73.7 13.2C80.8 11 94 11.4 99 14.2"
          stroke="#A4AFB8" stroke-width=".65" stroke-linecap="round"/>
    <path d="M67.5 42.7V23.2C67.5 19.2 69.8 16.4 73.4 15.1"
          stroke="#D8DEE3" stroke-width=".65"/>

    <!-- characteristic front window -->
    <path d="M68.2 20.1C68.9 17.6 70.5 16.1 73 15.5H78L77.1 25.2H67.5Z"
          fill="url(#glass)" stroke="#263847" stroke-width=".55"/>

    <!-- side windows -->
    <rect x="80.1" y="17.2" width="8.3" height="7.3" rx="1.15"
          fill="url(#glass)" stroke="#263847" stroke-width=".55"/>
    <rect x="94.9" y="17.5" width="7.2" height="7.1" rx="1.1"
          fill="url(#glass)" stroke="#263847" stroke-width=".55"/>

    <!-- door with window -->
    <rect x="89.7" y="26.7" width="5.8" height="15.9" rx=".85"
          fill="#F7F9FA" stroke="#8D99A4" stroke-width=".65"/>
    <rect x="90.5" y="27.8" width="4.2" height="4.8" rx=".65"
          fill="url(#glass)" stroke="#263847" stroke-width=".4"/>
    <circle cx="90.6" cy="34.8" r=".48" fill="#334553"/>

    <!-- Adria Altea graphics, simplified but model-specific -->
    <path d="M68.3 30.6H86.8" stroke="#2A8DCF" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M68.3 32.4H87.8" stroke="#596A78" stroke-width=".72" stroke-linecap="round"/>
    <path d="M96.6 30.6H102.7" stroke="#2A8DCF" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M96.6 32.4H102.7" stroke="#596A78" stroke-width=".72" stroke-linecap="round"/>

    <!-- vents / service hatch -->
    <rect x="79.1" y="35.5" width="6.2" height="3.2" rx=".45"
          fill="#EDF1F4" stroke="#98A4AE" stroke-width=".45"/>
    <path d="M80.1 36.4H84.3M80.1 37.2H84.3" stroke="#B1BAC2" stroke-width=".35"/>
    <rect x="99.1" y="36.2" width="3.2" height="3.2" rx=".45"
          fill="#EEF2F4" stroke="#98A4AE" stroke-width=".45"/>

    <!-- lower skirt and reflectors -->
    <path d="M65.4 43.4H104.5" stroke="#3D4D5B" stroke-width="1.3"/>
    <rect x="66.1" y="40.2" width="1.5" height="1.05" rx=".35" fill="#E8A73A"/>
    <rect x="102.5" y="40.1" width="1.5" height="1.1" rx=".35" fill="#C94146"/>

    <!-- caravan wheel and arch -->
    <path d="M80.4 43.5C80.5 39.6 83.4 37.1 86.9 37.1C90.5 37.1 93.3 39.7 93.4 43.5"
          stroke="#C3CBD1" stroke-width="1.1"/>
    <circle cx="86.9" cy="43.4" r="5.8" fill="#202B35"/>
    <circle cx="86.9" cy="43.4" r="3.55" fill="#D7DEE4" stroke="#707D88" stroke-width=".55"/>
    <path d="M86.9 40.4V46.4M83.9 43.4H89.9M84.8 41.3L89 45.5M89 41.3L84.8 45.5"
          stroke="#6D7984" stroke-width=".55"/>
    <circle cx="86.9" cy="43.4" r=".8" fill="#76838D"/>

    <!-- jockey wheel -->
    <path d="M64.2 39.7V45.8" stroke="#445462" stroke-width=".85"/>
    <circle cx="64.2" cy="46.7" r="1.25" fill="#263643"/>
  </g>
</svg>